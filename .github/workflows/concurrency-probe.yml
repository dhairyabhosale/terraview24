name: concurrency-probe

# TEMPORARY. Delete this file once the measurement is recorded in
# ARCHITECTURE.md section 9a.
#
# Question being measured: when three runs arrive at one concurrency group with
# cancel-in-progress false, is the second DROPPED or does GitHub queue it?
#
# Section 9a asserts that a group holds at most one pending run, so a third
# arrival cancels the already pending one. That assertion drove a real design
# change (per workflow groups, per family files, rebase and retry pushes), and
# it has never been measured. An architecture resting on an unmeasured claim is
# exactly what ground rule 11 is about.
#
# Why a throwaway probe rather than instrumenting the real workflows: a
# collision in production needs GitHub's scheduler to land within about 30
# seconds of a Worker dispatch, which is rare and cannot be arranged on demand.
# Waiting for one would mean waiting indefinitely and then reasoning from a
# single uncontrolled event. This creates the collision deliberately, in
# isolation, at no risk to the pipeline.
#
# The sleep must comfortably exceed the time taken to fire three dispatches, so
# that all three genuinely contend for the same group.

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Which of the three dispatches this is, for reading the results"
        required: false
        default: "0"
        type: string

concurrency:
  # Same shape as the production groups: a fixed name, no cancellation.
  group: concurrency-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Identify and hold the group
        env:
          DISPATCH_N: ${{ github.event.inputs.n }}
        run: |
          echo "dispatch n=${DISPATCH_N} run_id=${GITHUB_RUN_ID} started=$(date -u +%H:%M:%SZ)"
          sleep 90
          echo "dispatch n=${DISPATCH_N} finished=$(date -u +%H:%M:%SZ)"
